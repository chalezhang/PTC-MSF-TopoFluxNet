[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "poreai-flow-surrogate"
version = "0.1.0"
description = "OpenFOAM Foundation 13 supervised surrogate for steady porous-media p/U fields"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.5", "pillow>=9"]
[project.optional-dependencies]
test = ["pytest>=7"]
[tool.setuptools]
py-modules = ["config", "geometry", "mesh_writer", "generate_porous_media"]
[tool.setuptools.packages.find]
include = ["poreai*", "scripts*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
